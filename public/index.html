<!DOCTYPE html><html lang="si"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Nethu AI Bot</title>
<style>
:root{--bg:#0b0f1a;--card:#141b2d;--tx:#e8ecf6;--mu:#8a94ad;--ac:#25d366;--bd:#25304d}
@media(prefers-color-scheme:light){:root{--bg:#f2f5fa;--card:#fff;--tx:#111827;--mu:#667085;--bd:#dde3ee}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:520px;margin:auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}header img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:none}
h1{font-size:20px;margin:0;flex:1}.gear{background:none;border:0;font-size:24px;cursor:pointer;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;background:#888}.open{background:var(--ac)}.connecting,.code{background:#f5a623}
input,button{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin-bottom:8px}
button.p{background:var(--ac);color:#04210f;border:0;font-weight:700;cursor:pointer}button.d{background:#e5484d;color:#fff;border:0;cursor:pointer}
.code-box{font-size:30px;letter-spacing:3px;text-align:center;font-weight:800;padding:14px;border:2px dashed var(--ac);border-radius:12px;margin:8px 0}
small{color:var(--mu);display:block;margin-bottom:6px}.err{color:#e5484d;font-size:13px}
#panel{display:none}label{font-size:13px;color:var(--mu)}
</style></head><body>
<header><img id="logo"><h1 id="title">Nethu AI Bot</h1><button class="gear" onclick="openSet()">⚙️</button></header>
<div id="slots"></div>
<div class="card" id="panel"><h3 style="margin-top:0">⚙️ Settings</h3><div id="form"></div>
<button class="p" onclick="save()">💾 Save</button><button onclick="panel.style.display='none'">Close</button><div id="msg" class="err"></div></div>
<script>
const $=id=>document.getElementById(id);let adm='';
const txt={idle:'සම්බන්ධ නැත',connecting:'සම්බන්ධ වෙමින්...',code:'Code එක WhatsApp එකේ ගහන්න',open:'සම්බන්ධයි ✅'};
async function api(u,b,h={}){const r=await fetch(u,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',...h},body:b?JSON.stringify(b):undefined});return r.json()}
function slotHTML(i,s){return `<div class="card"><div class="row"><b>📱 Device ${i}</b><span><i class="dot ${s.status}"></i>${txt[s.status]}</span></div>`+
(s.status==='open'?`<small>+${s.number}</small><button class="d" onclick="out(${i})">Logout</button>`:
s.status==='code'?`<small>WhatsApp → Linked devices → Link with phone number</small><div class="code-box">${s.code}</div>`:
s.status==='connecting'?'':`<input id="n${i}" placeholder="94712345678" inputmode="numeric"><button class="p" onclick="pair(${i})">Pair Code ගන්න</button>`)+
(s.error?`<div class="err">${s.error}</div>`:'')+`</div>`}
let typing=false;async function load(){if(typing)return;const d=await api('/api/status');$('title').textContent=d.botName+' AI Bot';document.title=d.botName;
if(d.logo){$('logo').src=d.logo;$('logo').style.display='block'}
const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.id.startsWith('n'))return;
$('slots').innerHTML=slotHTML(1,d.slots[1])+slotHTML(2,d.slots[2])}
async function pair(i){const r=await api('/api/pair',{slot:i,number:$('n'+i).value});if(r.error)alert(r.error);load()}
async function out(i){if(confirm('Logout කරන්නද?')){await api('/api/logout',{slot:i});load()}}
const F=[['botName','Bot Name'],['owner','Bot / Owner number (94...)'],['sudo','Sudo numbers (කොමාවෙන් වෙන් කරන්න)'],['logo','Logo URL'],['provider','AI Provider (chatgpt / gemini)'],['chatKey','ChatGPT API Key (chamindu)'],['geminiKey','Gemini API Key'],['model','AI Model'],['mongoUrl','MongoDB URL (වෙනස් කළොත් restart වෙයි)']];
async function openSet(){adm=prompt('Admin password');if(!adm)return;const d=await api('/api/settings',null,{'x-admin':adm});
if(d.error)return alert(d.error);$('form').innerHTML=F.map(([k,l])=>`<label>${l}</label><input id="f_${k}" value="${(d[k]||'').replace(/"/g,'&quot;')}">`).join('');panel.style.display='block';panel.scrollIntoView()}
async function save(){const b={};F.forEach(([k])=>b[k]=$('f_'+k).value);const r=await api('/api/settings',b,{'x-admin':adm});
$('msg').style.color='#25d366';$('msg').textContent=r.restart?'Saved. Server restart වෙනවා...':r.error||'✅ Saved';load()}
load();setInterval(load,3000);
</script></body></html>
